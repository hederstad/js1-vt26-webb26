<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/mood.css">
    <title>JS - Mood Switcher</title>
</head>

<body>
    <h1>Välj ditt Mood 🙂😔</h1>

    <section id="moodBtnContainer">
        <button id="happyBtn" class="moodBtn">Glad 😃</button>
        <button id="angryBtn" class="moodBtn">Arg 😡</button>
        <button id="tiredBtn" class="moodBtn">Trött 😴</button>
        <button id="hypedBtn" class="moodBtn">Taggad 🤪</button>
    </section>

    <div id="moodBox"></div>

    <button id="resetBtn">Återställ</button>

    <script src="script/mood.js"></script>
</body>

</html>
