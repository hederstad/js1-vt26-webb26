<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <Link rel="stylesheet" href="style/index.css">


    <title>Javascript 1 - TODO Steg 3</title>
</head>

<body class="container min-vh-100 d-flex flex-column">
    <header>
        <h1>TODO App</h1>
    </header>

    <main class="flex-grow-1">
        <form id="todoForm">
            <div class="mb-3">
                <label for="todoInput" class="form-label">Skriv in din TODO</label>
                <input type="text" id="todoInput" class="form-control">
                <div id="todoHelp" class="form-text">Skriv minst 3 tecken</div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Lägg till</button>
        </form>

        <section class="todoContainer mt-3">
            <ul id="todoList" class="list-group"></ul>
        </section>
    </main>

    <footer>
        <p>2026</p>
    </footer>


    <script src="script/index.js"></script>
</body>

</html>
